<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的足球预测</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; }
    h1 { text-align: center; font-size: 20px; }
    .date { text-align: center; color: #888; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 8px; text-align: center; font-size: 13px; border-bottom: 1px solid #eee; }
    th { background: #2c3e50; color: #fff; }
    .home { color: #e74c3c; font-weight: bold; }
    .draw { color: #f39c12; }
    .away { color: #3498db; }
  </style>
</head>
<body>
  <h1>每日足球预测</h1>
  <div class="date" id="date"></div>
  <table>
    <thead>
      <tr>
        <th>赛事</th><th>时间</th><th>对阵</th><th>主胜</th><th>平</th><th>客胜</th><th>比分</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <script>
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('date').textContent = data.date;
        const tbody = document.getElementById('tbody');
        data.matches.forEach(m => {
          tbody.innerHTML += `<tr>
            <td>${m.league}</td><td>${m.time}</td>
            <td>${m.home} VS ${m.away}</td>
            <td class="home">${m.home_win}%</td>
            <td class="draw">${m.draw}%</td>
            <td class="away">${m.away_win}%</td>
            <td>${m.score}</td>
          </tr>`;
        });
      });
  </script>
</body>
</html>
